<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f1730"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Мамчкин и Папчкин</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8dcc6;--gr:#f7f0e2;--gold:#86601f;--cu:#b8754a;--tx:#1b2238;--mu:#6b6f80;--ln:#cdbfa6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#f9f3e7,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.45 system-ui,sans-serif}
#app{max-width:560px;margin:auto;padding:0 14px 96px}h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0}h2{font-size:23px;margin:16px 0 8px;color:var(--gold)}h3{font-size:27px}
header{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}header h1{font-size:25px;color:var(--gold)}.ln{font-size:30px}.ln.r{transform:scaleX(-1)}.gear{background:0;border:0;font-size:22px;color:var(--mu);margin-left:auto}
.p{background:linear-gradient(145deg,#f8f2e6,#efe5d2);border:1px solid var(--ln);border-radius:16px;padding:13px;margin:10px 0}.mu,small{color:var(--mu);font-size:13px}
.b{display:block;width:100%;border:0;border-radius:13px;padding:14px;margin:8px 0;background:linear-gradient(#efcf8e,#b98a3e);color:#1c160a;font:700 16px system-ui}.b.s{background:#f8f2e6;color:var(--tx);border:1px solid #cdb48a}.b.c{background:linear-gradient(#d68a5a,#9b5530);color:#fff}.b.sm{display:inline-block;width:auto;padding:7px 11px;font-size:14px;margin:4px 4px 0 0}
.r2{display:flex;gap:8px}.r2>*{flex:1}.hero{text-align:center;padding:20px 12px;border-color:#c9a35e}.sc{display:flex;justify-content:center;align-items:center;gap:14px}.sc div{flex:1}.sc span{font-size:34px;display:block}.sc b{font:700 44px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.sc em{font-size:30px;color:var(--cu)}
.pl{background:#f7f0e2;border:1px solid #cdb48a;border-radius:16px;color:var(--tx);padding:18px 6px;font-size:18px}.pl span{display:block;font-size:40px}.pl b{display:block;color:var(--gold);font-size:22px}
.card{min-height:300px;border:2px solid var(--gold);border-radius:22px;outline:1px solid #86601f55;outline-offset:-9px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;background:repeating-linear-gradient(135deg,#ffffff07 0 2px,transparent 2px 14px),linear-gradient(160deg,#1a2744,#0f1730);box-shadow:0 0 26px #86601f40;margin:10px 0}
.card.fl{animation:fl .5s}@keyframes fl{from{transform:perspective(700px) rotateX(-90deg)}to{transform:none}}.card.back{align-items:center;font-size:70px;color:var(--gold)}.card.back p{font-size:14px}.card.care{border-color:var(--cu);outline-color:#b8754a66;box-shadow:0 0 26px #b8754a55}.card.win{box-shadow:0 0 46px #86601f99}.card p{margin:4px 0}.gd{color:var(--gold);font-size:14px}.card i{font-style:normal;font-size:12px;color:var(--mu);letter-spacing:.5px}
.tm{font:700 56px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.bar{height:6px;background:#0007;border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:var(--gold);width:100%}
.tg{font-size:11px;border:1px solid #cdb48a;color:var(--gold);border-radius:99px;padding:2px 8px}.od{border-color:#c0564a}.od .tg{color:#c0564a;border-color:#c0564a}
.tabs{display:flex;margin:6px 0}.tabs button{flex:1;padding:10px 4px;background:#f3ead9;border:1px solid var(--ln);color:var(--tx);font-size:14px}.tabs .on{background:var(--gold);color:#1c160a;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g .p{margin:0;font-size:14px}.g b{color:var(--gold)}
input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#fffaf0;border:1px solid var(--ln);border-radius:9px;color:var(--tx);font:16px system-ui}textarea{height:130px}
details{margin-top:6px}summary{color:var(--gold);font-size:14px}.ev{padding:9px 0;border-bottom:1px solid #00000014}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#f3ead9ee;border-top:1px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;background:0;border:0;color:#7f879b;padding:9px 0;font-size:11px}nav b{display:block;font-size:21px;font-weight:400}nav .on{color:var(--gold)}
.sh{position:fixed;inset:0;background:#000b;z-index:9;display:grid;place-items:center;padding:14px}.dl{width:100%;max-width:500px;max-height:86vh;overflow:auto;background:#faf5ea;border:1px solid var(--gold);border-radius:18px;padding:18px}.dl h2{margin-top:0}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#f8f2e6;border:1px solid var(--gold);border-radius:12px;padding:11px 14px;z-index:20;max-width:90vw}
@media(prefers-reduced-motion:reduce){.card.fl{animation:none}}
.em{width:44px;height:44px;display:block;margin:auto}header .em{width:38px;height:38px;margin:0}.pl .em{width:56px;height:56px}
.card{position:relative;overflow-wrap:anywhere}.card::before,.card::after{content:'◆';position:absolute;top:12px;color:var(--gold);font-size:11px}.card::before{left:16px}.card::after{right:16px}
.card h3,.sc b{background:linear-gradient(100deg,#8a6a2b,#f6e3a6 40%,#b88a36 60%,#f0d48a);-webkit-background-clip:text;background-clip:text;color:transparent}.card.back{padding:8px}.bk{width:100%;max-height:340px}.bk *{vector-effect:non-scaling-stroke}
.b:active{transform:scale(.97)}.b[disabled]{opacity:.4}.card.care::before,.card.care::after{color:var(--cu)}
.sc .em,.pl .em{transform:scaleX(-1)}.sc b{background:none;color:var(--gold)}.pw{width:40px;height:36px;margin:2px auto}
.card{color:#f1e4d3;border-color:#cf9a52;outline-color:#cf9a5255;background:repeating-linear-gradient(45deg,#cf9a5216 0 1px,transparent 1px 24px),repeating-linear-gradient(-45deg,#cf9a5216 0 1px,transparent 1px 24px),linear-gradient(160deg,#1a2744,#0f1730);box-shadow:0 10px 26px #1b223866}
.card h3{background:linear-gradient(100deg,#a8782f,#f3dca0 40%,#c9964a 60%,#f6e2b0);-webkit-background-clip:text;background-clip:text;color:transparent}.card::before,.card::after{color:#cf9a52}.card i,.card small,.card .mu{color:#b4b9cc}.card .tm,.card .gd{color:#e8c483}.card .bar u{background:#dfb86f}
.card.win{box-shadow:0 0 0 2px #cf9a5288,0 12px 30px #1b223888}.card.care{border-color:#9fb3d6;outline-color:#9fb3d655;box-shadow:0 10px 26px #1b223877}.card.care h3{background:linear-gradient(100deg,#7d8fb3,#e4ecfa 45%,#9fb3d6 60%,#dfe8f7);-webkit-background-clip:text;background-clip:text}.card.care::before,.card.care::after{color:#9fb3d6}
.card.back{padding:0;background:none;border:0;outline:0;box-shadow:none;min-height:0}.card.back::before,.card.back::after{display:none}.bk{display:block;width:100%;max-width:340px;margin:auto;max-height:none;filter:drop-shadow(0 10px 18px #1b223877)}
.tabs .on{background:#dcb272;color:#1c160a}.p{box-shadow:0 2px 8px #1b223614}
.hemb{display:block;width:58%;max-height:150px;margin:0 auto 8px}
input[type=range]{padding:0}
.hdr{display:block;width:auto;max-width:100%;max-height:62vh;object-fit:contain;border-radius:14px;margin:10px auto}.dkc{display:flex;gap:12px;align-items:center}.dki{width:78px;height:112px;object-fit:cover;object-position:top;border-radius:8px;background:#0f1730;flex:none}.mc.s2{border-color:#6a9a62;background:linear-gradient(145deg,#eef5e6,#e2ecd6)}.mc.s1{border-color:#b98a3e}textarea{width:100%}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><pattern id="dm" width="26" height="44" patternUnits="userSpaceOnUse"><path d="M13 0L26 22 13 44 0 22ZM13 9L20 22 13 35 6 22Z" fill="none" stroke="#cf9a52" stroke-width=".6" opacity=".6"/></pattern><image id="emb" width="600" height="611" href="emblem.png"/><symbol id="lion" viewBox="0 0 300 336"><use href="#emb"/></symbol><symbol id="lioness" viewBox="300 0 300 336"><use href="#emb"/></symbol></defs></svg><div id="app"><header><svg class="em" viewBox="0 0 100 100"><use href="#lion"/></svg><h1>Мамчкин и Папчкин</h1><svg class="em" viewBox="0 0 100 100"><use href="#lioness"/></svg><button class="gear" id="sb" onclick="A.mt()">🔊</button><button class="gear" style="margin-left:0" onclick="A.set()">⚙</button></header><div id="v"></div></div><nav id="nav"></nav><div id="m"></div>
<script>
const DATA={"c":[{"id":"challenge-01","number":1,"deck":"challenge","title":"Зеркало","description":"Имитируй мимику, движения или звуки ребёнка 60 секунд. Бонус — улыбка.","difficulty":"Лёгкая","timerSeconds":60},{"id":"challenge-02","number":2,"deck":"challenge","title":"Ассистент Босса","description":"Предложи открытую ладонь и жди 30 секунд; не хватай и не направляй руку.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-03","number":3,"deck":"challenge","title":"Детская дискотека","description":"Мягко танцуй 30 секунд. Бонус — ребёнок наблюдает или двигается.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-04","number":4,"deck":"challenge","title":"Вызов улыбки","description":"Попробуй вызвать улыбку голосом и мимикой за 60 секунд, без игрушек.","difficulty":"Лёгкая","timerSeconds":60},{"id":"challenge-05","number":5,"deck":"challenge","title":"Повторяшка","description":"Трижды повтори звук ребёнка. Бонус — ответный звук.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-06","number":6,"deck":"challenge","title":"Мягкий шаг","description":"Пройди на цыпочках 5 шагов и замри в смешной позе на 10 секунд.","difficulty":"Лёгкая","timerSeconds":15},{"id":"challenge-07","number":7,"deck":"challenge","title":"Контакт взглядом","description":"Привлеки внимание улыбкой; интерес суммарно 30 секунд. Не принуждай к зрительному контакту.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-08","number":8,"deck":"challenge","title":"Башенка","description":"Построй из мягких кубиков башню минимум из 3 кубиков. Малыш может её «разрушить» — это бонус.","difficulty":"Лёгкая","timerSeconds":40},{"id":"challenge-09","number":9,"deck":"challenge","title":"Гримасы","description":"Покажи 3 смешные гримасы по 5 секунд.","difficulty":"Лёгкая","timerSeconds":15},{"id":"challenge-10","number":10,"deck":"challenge","title":"Мягкое шуршание","description":"Используй безопасную шуршащую игрушку; не используй громкие/опасные предметы.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-11","number":11,"deck":"challenge","title":"Выбор Босса","description":"Предложи 2 знакомые игрушки и предскажи, какая заинтересует ребёнка.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-12","number":12,"deck":"challenge","title":"Повелитель взгляда","description":"Медленно двигай игрушку; ребёнок следит суммарно ≥20 секунд за 45 секунд.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-13","number":13,"deck":"challenge","title":"Интуиция родителя","description":"За 60 секунд предскажи следующее действие ребёнка.","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-14","number":14,"deck":"challenge","title":"Ку-ку с перехватом","description":"Мягко появись слева/справа и добейся 3 проявлений интереса.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-15","number":15,"deck":"challenge","title":"Танец ладошек","description":"Мягкая игра ладонями с песенкой, только если ребёнку комфортно.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-16","number":16,"deck":"challenge","title":"Сказка про Босса","description":"Расскажи мини-сказку, где малыш — главный герой, в три части: начало, приключение, конец.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-17","number":17,"deck":"challenge","title":"Назови всё вокруг","description":"Назови малышу 10 предметов в комнате, показывая на каждый.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-18","number":18,"deck":"challenge","title":"Поисковик","description":"Спокойно позови слева и справа вне поля зрения; не кричи.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-19","number":19,"deck":"challenge","title":"Фокус с исчезновением","description":"Накрой игрушку лёгкой тканью и открой. Лицо ребёнка не закрывай.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-20","number":20,"deck":"challenge","title":"Реклама игрушки","description":"За 30 секунд представь игрушку как невероятное изобретение; закончи, не рассмеявшись.","difficulty":"Сложная","timerSeconds":30},{"id":"challenge-21","number":21,"deck":"challenge","title":"Евровидение для Босса","description":"Спой колыбельную 30 секунд. Микрофон не записывает звук; результат выбирается вручную.","difficulty":"Сложная","timerSeconds":30},{"id":"challenge-22","number":22,"deck":"challenge","title":"Диктор Босса","description":"Комментируй всё, что делает малыш, как спортивный репортёр.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-23","number":23,"deck":"challenge","title":"Портрет Босса","description":"Нарисуй портрет Босса на бумаге за 60 секунд. Фотографии и подсказки запрещены!","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-24","number":24,"deck":"challenge","title":"Тихий оркестр","description":"Сыграй три разных мягких ритма: ладонями по подушке, по мягкой игрушке и по сложенной ткани. Звук тихий.","difficulty":"Средняя","timerSeconds":40},{"id":"challenge-25","number":25,"deck":"challenge","title":"Паспорт Босса","description":"Без подсказок назови вслух 5 фактов о малыше: любимая игрушка, песенка, что смешит, как засыпает, как радуется.","difficulty":"Сложная","timerSeconds":60},{"id":"challenge-26","number":26,"deck":"challenge","title":"Тактильное путешествие","description":"Проведи по ладошке или ножке малыша тремя безопасными фактурами.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-27","number":27,"deck":"challenge","title":"Двойной фокус","description":"За 45 секунд заинтересуй ребёнка двумя знакомыми игрушками.","difficulty":"Сложная","timerSeconds":45},{"id":"challenge-28","number":28,"deck":"challenge","title":"Смешинка","description":"Попробуй вызвать смех или радостный визг за 60 секунд; не щекочи и не пугай.","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-29","number":29,"deck":"challenge","title":"Угадай настроение","description":"Определи по сигналам, заинтересован ли ребёнок, устал или хочет паузу. Это не диагностика.","difficulty":"Сложная"," return h+'<button class="b" onclick="M()">Закрыть</button>'}

ask(id,i){WB={id,x:[...COMPS,...S.comps][i]};const t=WT(id);M(`<h2>${E(S.n[1-t.w])}, принимаете?</h2><p>«${E(WB.x)}»</p><button class="b" onclick="Wx.rs(1)">Принять</button><button class="b c" onclick="Wx.rs(0)">Отклонить</button>`)},
rs(ok){const t=WT(WB.id);t.lg.push([Date.now(),(ok?'откуп принят: ':'откуп отклонён: ')+WB.x]);wlog(WC(t.c).t,t.w,(ok?'Откуплен: ':'Откуп отклонён: ')+WB.x);if(ok)t.s='b';wsave();M();go()},
ab(id){const a=W.ab.find(x=>x.id==id),el=W.tk.filter(t=>t.w==a.w&&t.s=='a'&&wk(t.c)=='k');if(!el.length)return M(`<h2>${E(WC(a.c).t)}</h2><p>Нужен ваш активный билет заботы. Способность не потрачена.</p><button class="b" onclick="M()">Понятно</button>`);
M(`<h2>${E(WC(a.c).t)}</h2><p class="mu">Выберите билет для отмены.</p>${el.map(t=>`<button class="b s" onclick="Wx.cn(${a.id},${t.id})">${E(WC(t.c).t)}</button>`).join('')}`)},
cn(a,t){const ab=W.ab.find(x=>x.id==a),k=WT(t);if(!ab.ok||k.s!='a')return;ab.ok=0;k.s='x';k.lg.push([Date.now(),'отменён: '+WC(ab.c).t]);wlog(WC(ab.c).t,ab.w,'Отменён билет «'+WC(k.c).t+'»');wsave();M();go()}};
const wtools=()=>`<div class="r2"><button class="b s" onclick="Wx.skip()">Пропустить без штрафа</button>${W.g.rep?'':'<button class="b s" onclick="Wx.rep()">Заменить карту</button>'}</div>`;
function wtick(){clearInterval(wtim);const g=W.g;if(tab!='decks'||dm!='waiting'||wt!='game'||!g||g.done||!g.c||g.tm!=1)return;const c=WC(g.c),u=()=>{const n=Math.max(0,Math.ceil((g.end-Date.now())/1000)),e=$('#tm');if(e){e.textContent=fmt(n);$('#tb').style.width=100*n/c.s+'%'}if(n>0&&n<=5&&g.ln!==n){g.ln=n;sfx('tick')}if(!n){clearInterval(wtim);g.tm=2;sfx('tend');wsave();toast('Время вышло. Выберите результат вручную.');go()}};u();wtim=setInterval(u,250)}
const wtk=t=>{const c=WC(t.c),od=t.s=='a'&&Date.now()>t.got+t.days*DAY;return `<div class="p ${od?'od':''}"><b>${E(c.t)}</b> <span class="tg">${od?'Просрочен':{a:'Активен',d:'Выполнен',b:'Откуплен',x:'Отменён'}[t.s]}</span><br><small>${E(S.n[t.w])} · получен ${D(t.got)} · срок до ${D(t.got+t.days*DAY)}</small>${t.s=='a'?`<select onchange="Wx.dy(${t.id},this.value)">${Array.from({length:14},(_,i)=>`<option value="${i+1}" ${t.days==i+1?'selected':''}>Срок: ${i+1} дн.</option>`).join('')}</select><div class="r2"><button class="b" onclick="Wx.td(${t.id})">Выполнено</button>${wk(t.c)=='k'?`<button class="b s" onclick="Wx.buy(${t.id})">Откупиться</button>`:''}</div>`:''}<details><summary>Описание и журнал</summary><p>${E(c.d.replace(/~/g,' '))}</p><p class="mu">${E(c.w)}</p>${t.lg.map(l=>`<small class="mu">${D(l[0])} — ${E(l[1])}</small><br>`).join('')}</details></div>`};
function wv(){const g=W.g,H=`<div class="tabs">${[['game','Игра'],['tickets','Билеты'],['hist','История']].map(([k,n])=>`<button class="${wt==k?'on':''}" onclick="wt='${k}';go()">${n}</button>`).join('')}</div>`;
if(wt=='tickets'){const own=W.tk.filter(t=>t.w==wtw&&(wtc==0?wk(t.c)=='k':wk(t.c)=='r')).reverse();return H+`<div class="tabs">${[0,1].map(i=>`<button class="${wtw==i?'on':''}" onclick="wtw=${i};go()">${E(S.n[i])}</button>`).join('')}</div><div class="tabs">${['Задания','Награды','Способности'].map((n,i)=>`<button class="${wtc==i?'on':''}" onclick="wtc=${i};go()">${n}</button>`).join('')}</div>${wtc==2?(W.ab.filter(a=>a.w==wtw).map(a=>`<div class="p"><b>🛡️ ${E(WC(a.c).t)}</b> <span class="tg">${a.ok?'Доступна':'Использована'}</span><p class="mu">${E(WC(a.c).d)}</p>${a.ok?`<button class="b" onclick="Wx.ab(${a.id})">Использовать</button>`:''}</div>`).join('')||'<p class="mu">Способностей пока нет.</p>'):(own.map(wtk).join('')||'<p class="mu">Билетов пока нет.</p>')}`}
if(wt=='hist')return H+(W.hist.map(h=>`<div class="ev"><b>${E(h.t)}</b><br><small>${h.w==null?'Игра':E(S.n[h.w])} · ${D(h.d)}</small><br>${E(h.r)}</div>`).join('')||'<p class="mu">Событий пока нет.</p>');
const sc=`<div class="p">${[0,1].map(i=>E(S.n[i])+': <b>'+W.pts[i]+'</b>').join(' · ')}</div>`;
if(!g||!g.on)return H+`<img class="hdr" src="h-waiting.jpg" alt="">${sc}<button class="b" onclick="Wx.st()">Начать игру</button>`;
if(!g.c)return H+`${sc}<h2>Кто исполняет испытание?</h2><div class="r2">${[0,1].map(i=>`<button class="pl" onclick="Wx.pw(${i})"><span>${em(i)}</span>${E(S.n[i])}<b>${W.pts[i]}</b></button>`).join('')}</div><button class="b s" onclick="if(confirm('Очки обнулятся, история и билеты сохранятся.')){W.g=null;wsave();go()}">Новая партия</button>`;
const c=WC(g.c);
if(g.done){const r=WC(g.res.r),w=r.n>30;return H+`<h2>${g.res.ok?'Успех! +1 очко':'Неудача — время заботы'}</h2><div class="card ${g.na?'fl':''} ${w?'win':'care'}"><i>${w?'НАГРАДА':'ЗАБОТА'} №${r.n} · ${E(r.x)}</i><h3>${E(r.t)}</h3><p style="white-space:pre-line">${E(r.d.replace(/~/g,'\n'))}</p><p class="mu">${E(r.w)}</p><p class="gd">${E(g.res.m||'')}</p></div>${g.pick?`<div class="p"><b>Супер-ожидание: выберите награду</b>${g.pick.map(n=>`<button class="b" onclick="Wx.pk(${n})">${E(WC(n).t)}</button>`).join('')}<small>Вторая карта остаётся в колоде.</small></div>`:`<div class="r2"><button class="b" onclick="Wx.nx()">Следующая карта</button><button class="b s" onclick="Wx.nx(1)">К колодам</button></div>`}`}
if(!g.fl)return H+`<h2>Исполнитель: ${E(S.n[g.w])}</h2><div class="card back" onclick="Wx.fl()"><img src="h-waiting.jpg" alt="" style="width:100%;max-height:60vh;object-fit:contain;border-radius:14px"></div><button class="b" onclick="Wx.fl()">ВЗЯТЬ КАРТУ</button>${wtools()}`;
return H+`<h2>Исполнитель: ${E(S.n[g.w])}</h2><div class="card ${g.na?'fl':''}"><i>ИСПЫТАНИЕ №${c.n} · ${E(c.x)}</i><h3>${E(c.t)}</h3><p style="white-space:pre-line">${E(c.d.replace(/~/g,'\n'))}</p><p class="gd">Победа: ${E(c.w)}</p>${c.s?`<div class="tm" id="tm">${fmt(g.tm==0?c.s:0)}</div><div class="bar"><u id="tb" style="width:${g.tm==0?100:0}%"></u></div><small>${['ОЖИДАНИЕ ЗАПУСКА','ТАЙМЕР ЗАПУЩЕН','ВРЕМЯ ВЫШЛО'][g.tm|0]}</small>`:''}</div>${c.s&&!g.tm?'<button class="b" onclick="Wx.ts()">ЗАПУСТИТЬ ТАЙМЕР</button><small class="mu">Результат можно выбрать после запуска таймера.</small>':''}<div class="r2"><button class="b" ${c.s&&!g.tm?'disabled':''} onclick="Wx.fin(1)">✓ Успех</button><button class="b c" ${c.s&&!g.tm?'disabled':''} onclick="Wx.fin(0)">✕ Неудача</button></div>${wtools()}`}
function go(){clearInterval(tim);if(tab!='game'||!S.g||S.g.done||S.g.tm!=1)mstop();$('#v').innerHTML=tab=='game'&&S.g?gv():({home:hv,game:hv,decks:dv2,tickets:tv,hist:iv,rules:rv})[tab]();$('#nav').innerHTML=[['home','🏠','Главная'],['decks','🃏','Колоды'],['tickets','🎫','Билеты'],['hist','📖','История'],['rules','📜','Правила']].map(([k,i,n])=>`<button class="${tab==k||(tab=='game'&&k=='home')?'on':''}" onclick="tab='${k}';go()"><b>${i}</b>${n}</button>`).join('');tick();wtick();sync();{const b=$('#sb');if(b)b.textContent=AU.mute?'🔇':'🔊'}if(S.g)S.g.na=0;scrollTo(0,0)}
addEventListener('pagehide',()=>{mstop();save()});document.addEventListener('visibilitychange',()=>{if(document.hidden){mstop();if(AU.ctx){try{AU.ctx.suspend()}catch(e){}}return}if(AU.ctx){try{AU.ctx.resume()}catch(e){}}tick()});document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('click')});go();
if(!S.ob)M(`<h2>Добро пожаловать</h2><p>Успех приносит очко и награду, неудача — карту заботы. Билеты хранят награды и задания, откуп и способности помогают договориться. Комфорт малыша всегда важнее игры.</p><button class="b" onclick="S.ob=1;save();M()">Начать</button><button class="b s" onclick="S.ob=1;save();M()">Пропустить</button>`);
else if(S.g?.on&&S.g.c)M(`<h2>🦁 Босс вернулся!</h2><p>Мы сохранили твою игру. Продолжаем с того места, где остановились?</p><button class="b" onclick="AU.go=1;M();tab='game';go()">Продолжить игру</button><button class="b s" onclick="M()">На главную</button>`);

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>

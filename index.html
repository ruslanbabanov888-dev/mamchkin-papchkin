<style>
:root{--bg:#e8dcc6;--gold:#86601f;--cu:#b8754a;--tx:#1b2238;--mu:#6b6f80;--ln:#cdbfa6;--rose:#c76a8a;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% -10%,#f9f3e7,var(--bg) 60%) fixed;color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-track{background:#e2d4ba}::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}::-webkit-scrollbar-thumb:hover{background:#a67a2e}
#app{max-width:560px;margin:auto;padding:0 14px 96px}h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0}h2{font-size:23px;margin:16px 0 8px;color:var(--gold)}h3{font-size:26px}
header{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}header h1{font-size:24px;color:var(--gold)}.gear{background:0;border:0;font-size:22px;color:var(--mu);margin-left:auto;cursor:pointer}
.p{background:linear-gradient(145deg,#f8f2e6,#efe5d2);border:1px solid var(--ln);border-radius:16px;padding:13px;margin:10px 0;box-shadow:0 2px 8px #1b223614}.mu,small{color:var(--mu);font-size:13px}
.b{display:block;width:100%;border:0;border-radius:13px;padding:14px;margin:8px 0;background:linear-gradient(#efcf8e,#b98a3e);color:#1c160a;font:700 16px system-ui;cursor:pointer}.b.s{background:#f8f2e6;color:var(--tx);border:1px solid #cdb48a}.b.c{background:linear-gradient(#d68a5a,#9b5530);color:#fff}.b.sm{display:inline-block;width:auto;padding:7px 11px;font-size:14px;margin:4px 4px 0 0}.b:active{transform:scale(.97)}.b[disabled]{opacity:.4}
.r2{display:flex;gap:8px}.r2>*{flex:1}.hero{text-align:center;padding:20px 12px;border-color:#c9a35e}.sc{display:flex;justify-content:center;align-items:center;gap:14px}.sc div{flex:1}.sc span{font-size:20px;display:block}.sc b{font:700 44px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.sc em{font-size:28px;color:var(--cu);font-style:normal}
.pl{background:#f7f0e2;border:1px solid #cdb48a;border-radius:16px;color:var(--tx);padding:18px 6px;font-size:17px;cursor:pointer}.pl span{display:block}.pl b{display:block;color:var(--gold);font-size:22px}
.card{min-height:300px;border:2px solid #cf9a52;border-radius:22px;outline:1px solid #cf9a5255;outline-offset:-9px;padding:24px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;color:#f1e4d3;background:repeating-linear-gradient(45deg,#cf9a5216 0 1px,transparent 1px 24px),repeating-linear-gradient(-45deg,#cf9a5216 0 1px,transparent 1px 24px),linear-gradient(160deg,#1a2744,#0f1730);box-shadow:0 10px 26px #1b223866;margin:10px 0;position:relative;overflow-wrap:anywhere}
.card.fl{animation:fl .5s}@keyframes fl{from{transform:perspective(700px)rotateX(-90deg)}to{transform:none}}
.card::before,.card::after{content:'◆';position:absolute;top:12px;color:#cf9a52;font-size:11px}.card::before{left:16px}.card::after{right:16px}
.card h3{background:linear-gradient(100deg,#a8782f,#f3dca0 40%,#c9964a 60%,#f6e2b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.card i{font-style:normal;font-size:12px;color:#b4b9cc;letter-spacing:.5px}.card p{margin:4px 0}.card small,.card .mu{color:#b4b9cc}.card .tm,.card .gd{color:#e8c483}
.card.care{border-color:#9fb3d6;outline-color:#9fb3d655}.card.care h3{background:linear-gradient(100deg,#7d8fb3,#e4ecfa 45%,#9fb3d6 60%,#dfe8f7);-webkit-background-clip:text;background-clip:text}.card.care::before,.card.care::after{color:#9fb3d6}
.card.rose{border-color:var(--rose);outline-color:#c76a8a55}.card.rose h3{background:linear-gradient(100deg,#b05a78,#f6d4e0 45%,#c76a8a 60%,#f0c2d4);-webkit-background-clip:text;background-clip:text}.card.rose::before,.card.rose::after{color:var(--rose)}
.card.win{box-shadow:0 0 0 2px #cf9a5288,0 12px 30px #1b223888}
.card.back{padding:0;background:none;border:0;outline:0;box-shadow:none;min-height:0;cursor:pointer}.card.back::before,.card.back::after{display:none}.card.back img{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;filter:drop-shadow(0 10px 18px #1b223877)}
.tm{font:700 54px 'Cormorant Garamond',Georgia,serif;color:var(--gold)}.bar{height:6px;background:#0007;border-radius:9px;overflow:hidden}.bar u{display:block;height:100%;background:#dfb86f;width:100%}
.tg{font-size:11px;border:1px solid #cdb48a;color:var(--gold);border-radius:99px;padding:2px 8px}.tg.ok{color:#4c8a44;border-color:#4c8a44}.od{border-color:#c0564a}.od .tg{color:#c0564a;border-color:#c0564a}
.tabs{display:flex;margin:6px 0;flex-wrap:wrap}.tabs button{flex:1;padding:10px 4px;background:#f3ead9;border:1px solid var(--ln);color:var(--tx);font-size:13px;cursor:pointer;min-width:70px}.tabs .on{background:#dcb272;color:#1c160a;font-weight:700}
input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#fffaf0;border:1px solid var(--ln);border-radius:9px;color:var(--tx);font:16px system-ui}textarea{height:110px}input[type=range]{padding:0}
details{margin-top:6px}summary{color:var(--gold);font-size:14px;cursor:pointer}.ev{padding:9px 0;border-bottom:1px solid #00000014}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#f3ead9ee;border-top:1px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}nav button{flex:1;background:0;border:0;color:#7f879b;padding:9px 0;font-size:11px;cursor:pointer}nav b{display:block;font-size:21px;font-weight:400}nav .on{color:var(--gold)}
.sh{position:fixed;inset:0;background:#000b;z-index:9;display:grid;place-items:center;padding:14px}.dl{width:100%;max-width:500px;max-height:86vh;overflow:auto;background:#faf5ea;border:1px solid var(--gold);border-radius:18px;padding:18px}.dl h2{margin-top:0}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#f8f2e6;border:1px solid var(--gold);border-radius:12px;padding:11px 14px;z-index:20;max-width:90vw}
@media(prefers-reduced-motion:reduce){.card.fl{animation:none}}
.em{width:44px;height:44px;display:block;margin:auto}header .em{width:36px;height:36px;margin:0}.pl .em{width:52px;height:52px}.sc .em{transform:scaleX(-1)}
.hdr{display:block;width:auto;max-width:100%;max-height:56vh;object-fit:contain;border-radius:14px;margin:10px auto}
.dkc{display:flex;gap:12px;align-items:center;cursor:pointer}.dki{width:78px;height:112px;object-fit:cover;object-position:top;border-radius:8px;background:#0f1730;flex:none}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:14px 0}
.dot{aspect-ratio:1;border-radius:50%;border:2px solid #00000022;display:grid;place-items:center;font:700 15px system-ui;color:#fff;cursor:pointer;transition:transform .12s}
.dot:active{transform:scale(.88)}.dot.no{background:radial-gradient(circle at 35% 30%,#e08a7a,#c0564a)}.dot.ok{background:radial-gradient(circle at 35% 30%,#8fce86,#5f9e57);box-shadow:0 0 10px #5f9e5766}
.pass{border-left:4px solid var(--gold)}.pass.burn{opacity:.55;border-left-color:#c0564a}
.score-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #00000012}.score-row b{margin-left:auto;font-size:22px;color:var(--gold)}
.adbox{text-align:center}.chip{display:inline-block;background:#f3ead9;border:1px solid var(--ln);border-radius:99px;padding:3px 10px;font-size:12px;margin:2px}
</style></head><body>

<div id="app"><header><svg class="em" viewBox="0 0 100 100" aria-hidden="true"><use href="#lion"/></svg><h1>Мамчкин и Папчкин</h1><svg class="em" viewBox="0 0 100 100" aria-hidden="true"><use href="#lioness"/></svg><button class="gear" id="sb" aria-label="Звук" onclick="A.mt()">🔊</button><button class="gear" style="margin-left:0" aria-label="Настройки" onclick="A.set()">⚙</button></header><div id="v"></div></div>

<script>
const DATA={"c":[{"id":"challenge-01","number":1,"deck":"challenge","title":"Зеркало","description":"Имитируй мимику, движения или звуки ребёнка 60 секунд. Бонус — улыбка.","difficulty":"Лёгкая","timerSeconds":60},{"id":"challenge-02","number":2,"deck":"challenge","title":"Ассистент Босса","description":"Предложи открытую ладонь и жди 30 секунд; не хватай и не направляй руку.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-03","number":3,"deck":"challenge","title":"Детская дискотека","description":"Мягко танцуй 30 секунд. Бонус — ребёнок наблюдает или двигается.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-04","number":4,"deck":"challenge","title":"Вызов улыбки","description":"Попробуй вызвать улыбку голосом и мимикой за 60 секунд, без игрушек.","difficulty":"Лёгкая","timerSeconds":60},{"id":"challenge-05","number":5,"deck":"challenge","title":"Повторяшка","description":"Трижды повтори звук ребёнка. Бонус — ответный звук.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-06","number":6,"deck":"challenge","title":"Мягкий шаг","description":"Пройди на цыпочках 5 шагов и замри в смешной позе на 10 секунд.","difficulty":"Лёгкая","timerSeconds":15},{"id":"challenge-07","number":7,"deck":"challenge","title":"Контакт взглядом","description":"Привлеки внимание улыбкой; интерес суммарно 30 секунд. Не принуждай к зрительному контакту.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-08","number":8,"deck":"challenge","title":"Башенка","description":"Построй из мягких кубиков башню минимум из 3 кубиков. Малыш может её «разрушить» — это бонус.","difficulty":"Лёгкая","timerSeconds":40},{"id":"challenge-09","number":9,"deck":"challenge","title":"Гримасы","description":"Покажи 3 смешные гримасы по 5 секунд.","difficulty":"Лёгкая","timerSeconds":15},{"id":"challenge-10","number":10,"deck":"challenge","title":"Мягкое шуршание","description":"Используй безопасную шуршащую игрушку; не используй громкие/опасные предметы.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-11","number":11,"deck":"challenge","title":"Выбор Босса","description":"Предложи 2 знакомые игрушки и предскажи, какая заинтересует ребёнка.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-12","number":12,"deck":"challenge","title":"Повелитель взгляда","description":"Медленно двигай игрушку; ребёнок следит суммарно ≥20 секунд за 45 секунд.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-13","number":13,"deck":"challenge","title":"Интуиция родителя","description":"За 60 секунд предскажи следующее действие ребёнка.","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-14","number":14,"deck":"challenge","title":"Ку-ку с перехватом","description":"Мягко появись слева/справа и добейся 3 проявлений интереса.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-15","number":15,"deck":"challenge","title":"Танец ладошек","description":"Мягкая игра ладонями с песенкой, только если ребёнку комфортно.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-16","number":16,"deck":"challenge","title":"Сказка про Босса","description":"Расскажи мини-сказку, где малыш — главный герой, в три части: начало, приключение, конец.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-17","number":17,"deck":"challenge","title":"Назови всё вокруг","description":"Назови малышу 10 предметов в комнате, показывая на каждый.","difficulty":"Лёгкая","timerSeconds":30},{"id":"challenge-18","number":18,"deck":"challenge","title":"Поисковик","description":"Спокойно позови слева и справа вне поля зрения; не кричи.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-19","number":19,"deck":"challenge","title":"Фокус с исчезновением","description":"Накрой игрушку лёгкой тканью и открой. Лицо ребёнка не закрывай.","difficulty":"Средняя","timerSeconds":30},{"id":"challenge-20","number":20,"deck":"challenge","title":"Реклама игрушки","description":"За 30 секунд представь игрушку как невероятное изобретение; закончи, не рассмеявшись.","difficulty":"Сложная","timerSeconds":30},{"id":"challenge-21","number":21,"deck":"challenge","title":"Евровидение для Босса","description":"Спой колыбельную 30 секунд. Микрофон не записывает звук; результат выбирается вручную.","difficulty":"Сложная","timerSeconds":30},{"id":"challenge-22","number":22,"deck":"challenge","title":"Диктор Босса","description":"Комментируй всё, что делает малыш, как спортивный репортёр.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-23","number":23,"deck":"challenge","title":"Портрет Босса","description":"Нарисуй портрет Босса на бумаге за 60 секунд. Фотографии и подсказки запрещены!","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-24","number":24,"deck":"challenge","title":"Тихий оркестр","description":"Сыграй три разных мягких ритма: ладонями по подушке, по мягкой игрушке и по сложенной ткани. Звук тихий.","difficulty":"Средняя","timerSeconds":40},{"id":"challenge-25","number":25,"deck":"challenge","title":"Паспорт Босса","description":"Без подсказок назови вслух 5 фактов о малыше: любимая игрушка, песенка, что смешит, как засыпает, как радуется.","difficulty":"Сложная","timerSeconds":60},{"id":"challenge-26","number":26,"deck":"challenge","title":"Тактильное путешествие","description":"Проведи по ладошке или ножке малыша тремя безопасными фактурами.","difficulty":"Средняя","timerSeconds":45},{"id":"challenge-27","number":27,"deck":"challenge","title":"Двойной фокус","description":"За 45 секунд заинтересуй ребёнка двумя знакомыми игрушками.","difficulty":"Сложная","timerSeconds":45},{"id":"challenge-28","number":28,"deck":"challenge","title":"Смешинка","description":"Попробуй вызвать смех или радостный визг за 60 секунд; не щекочи и не пугай.","difficulty":"Средняя","timerSeconds":60},{"id":"challenge-29","number":29,"deck":"challenge","title":"Угадай настроение","description":"Определи по сигналам, заинтересован ли ребёнок, устал или хочет паузу. Это не диагностика.","difficulty":"Сложная"," const n=[0,0];for(let i=1;i<=40;i++)n[MM.st[i]==2?1:0]++;
const L=Array.from({length:40},(_,i)=>i+1).filter(i=>mf<0||((i-1)>>2)==mf);
return `<img class="hdr" src="h-memories.jpg" alt=""><h2>40 маленьких историй</h2><div class="p"><b>Выполнено: ${n[1]} из 40</b><div class="bar" style="background:#0002;margin:8px 0"><u style="width:${n[1]*100/40}%;background:#5f9e57"></u></div><small class="mu">🟢 выполнено · 🔴 не выполнено. Нажми на кружочек, чтобы открыть карту.</small><br><button class="b s sm" onclick="A.mi()">Как создать семейный архив</button></div><select onchange="mf=+this.value;go()"><option value="-1">Все направления</option>${MT.map((t,i)=>`<option value="${i}" ${mf==i?'selected':''}>${i+1}. ${E(t)}</option>`).join('')}</select><div class="dots">${L.map(i=>`<button class="dot ${MM.st[i]==2?'ok':'no'}" aria-label="Карточка ${i}" onclick="A.ms(${i})">${i}</button>`).join('')}</div><p class="mu">Мы не соревнуемся. Мы вместе собираем историю взросления нашего Босса.</p>`}
const DECKS=[['base','Мамчкин и Папчкин','Основной релиз','emblem.png'],['waiting','Уровень «Ожидание»','Пролог для будущих родителей','h-waiting.jpg'],['team','Командный режим','Вся банда в деле','h-team.jpg'],['secret','Секретный уровень','Только для двоих после отбоя','h-secret.jpg'],['mem','Режим сохранения','Семейные ритуалы и якоря памяти','h-memories.jpg']];
function dv2(){if(!dm)return `<h2>Колоды</h2><p class="mu">Базовая колода бесплатна. Остальные открываются за просмотр рекламы.</p>`+DECKS.map(d=>{const locked=d[0]!='base'&&!UN[d[0]];return `<div class="p dkc" onclick="A.dm('${d[0]}')"><img class="dki" src="${d[3]}" alt=""><div><b>${E(d[1])}</b><br><small>${E(d[2])}</small><br><span class="tg ${locked?'':'ok'}">${locked?'🔒 За рекламу':'Открыто'}</span></div></div>`}).join('');
const bk='<button class="b s sm" onclick="dm=null;msel=0;go()">← Все колоды</button>';
if(dm=='base')return bk+gv();if(dm=='waiting')return bk+wv();if(dm=='team')return bk+tv2();if(dm=='secret')return bk+qv();if(dm=='mem')return bk+mv();return bk}
function baseTicket(t){const c=card(t.c),od=t.s=='a'&&Date.now()>t.got+t.days*DAY,lf=Math.ceil((t.got+t.days*DAY-Date.now())/DAY);return `<div class="p ${od?'od':''}"><b>${E(c.title)}</b> <span class="tg">${od?'Просрочен':{a:'Активен',d:'Выполнен',b:'Откуплен',x:'Отменён'}[t.s]}</span><br><small>${E(S.n[t.w])} · до ${D(t.got+t.days*DAY)}${t.s=='a'&&!od?' · осталось '+lf+' дн.':''}</small>${t.s=='a'?`<select onchange="A.dy(${t.id},this.value)">${Array.from({length:14},(_,i)=>`<option value="${i+1}" ${t.days==i+1?'selected':''}>Срок: ${i+1} дн.</option>`).join('')}</select><div class="r2"><button class="b" onclick="A.td(${t.id})">Выполнено</button>${dkey(t.c)=='k'?`<button class="b s" onclick="A.buy(${t.id})">Откупиться</button>`:''}</div>`:''}<details><summary>Описание и журнал</summary><p>${E(c.description)}</p>${t.lg.map(l=>`<small class="mu">${D(l[0])} — ${E(l[1])}</small><br>`).join('')}</details></div>`}
function tv(){const cats=['Задания','Награды','Способности','Абонементы'];let body;
if(tc==3){body=`<p class="mu">Абонементы Секретного уровня. Сгорают в конце текущего месяца.</p>`+(Q.ps.filter(p=>p.w==tw).reverse().map(passRow).join('')||'<p class="mu">Абонементов пока нет. Откройте Секретный уровень и выигрывайте испытания.</p>')}
else if(tc==2){body=S.ab.filter(a=>a.w==tw).map(a=>`<div class="p"><b>🛡️ ${E(card(a.c).title)}</b> <span class="tg">${a.ok?'Доступна':'Использована'}</span><p class="mu">${E(card(a.c).description)}</p>${a.ok?`<button class="b" onclick="A.ab(${a.id})">Использовать</button>`:''}</div>`).join('')||'<p class="mu">Способностей пока нет.</p>'}
else{body=S.tk.filter(t=>t.w==tw&&(tc==0?dkey(t.c)=='k':dkey(t.c)=='r')).reverse().map(baseTicket).join('')||'<p class="mu">Билетов пока нет.</p>'}
return `<h2>Билеты</h2><div class="tabs">${[0,1].map(i=>`<button class="${tw==i?'on':''}" onclick="tw=${i};go()">${E(S.n[i])}</button>`).join('')}</div><div class="tabs">${cats.map((n,i)=>`<button class="${tc==i?'on':''}" onclick="tc=${i};go()">${n}</button>`).join('')}</div>${body}`}
function histHTML(h,names){return (h.map(x=>`<div class="ev"><b>${E(x.t)}</b><br><small>${x.w==null?'Игра':E(names?names[x.w]:(S.n[x.w]||''))} · ${D(x.d)}</small><br>${E(x.r)}</div>`).join('')||'<p class="mu">Событий пока нет.</p>')}
function iv(){return `<h2>История</h2>`+histHTML(S.hist)}
function rv(){return `<h2>Правила</h2><div class="p"><b>Основная игра</b><p class="mu">Успех приносит очко и награду, неудача — карту заботы. Билеты хранят задания и награды, откуп и способности помогают договориться. Комфорт малыша всегда важнее игры.</p></div><div class="p"><b>Колоды</b><p class="mu">Базовая колода бесплатна. «Ожидание», «Командный», «Секретный» и «Сохранение» открываются за просмотр рекламы. В веб-версии показывается демо-пауза, в VK — настоящая реклама.</p></div><div class="p"><b>Абонементы</b><p class="mu">Награды Секретного уровня — одноразовые абонементы. Они сгорают в конце текущего месяца и не передаются другому игроку. Любая привилегия — только по взаимному согласию.</p></div><div class="p"><b>Безопасность</b><p class="mu">Нельзя заставлять выполнять некомфортное задание — карту можно заменить без штрафа. Срочный уход и безопасность не отменяются никакими картами.</p></div>`}
let tab='home',dm=null,wt='game',wtw=0,wtc=0,tt='game',qt='game',qtw=0,tw=0,tc=0,mf=-1,msel=0,mflip=0;
function inGame(){return (tab=='game'&&S.g)||(tab=='decks'&&(dm=='waiting'||dm=='team'||dm=='secret'||dm=='base'))}
function activeGame(){if(tab=='game'&&S.g)return{g:S.g,sec:card(S.g.c)?card(S.g.c).timerSeconds:0,sv:save};
if(tab=='decks'){if(dm=='waiting'&&W.g)return{g:W.g,sec:WC(W.g.c)?WC(W.g.c).s:0,sv:wsave};if(dm=='team'&&T.g)return{g:T.g,sec:TC(T.g.c)?TC(T.g.c).s:0,sv:tsave};if(dm=='secret'&&Q.g)return{g:Q.g,sec:QC(Q.g.c)?QC(Q.g.c).s:0,sv:qsave};if(dm=='base'&&S.g)return{g:S.g,sec:card(S.g.c)?card(S.g.c).timerSeconds:0,sv:save}}return null}
function go(){burnPasses();const view=(tab=='game'&&S.g)?gv():({home:hv,game:hv,decks:dv2,tickets:tv,hist:iv,rules:rv})[tab]();$('#v').innerHTML=view;
$('#nav').innerHTML=[['home','🏠','Главная'],['decks','🃏','Колоды'],['tickets','🎫','Билеты'],['hist','📖','История'],['rules','📜','Правила']].map(([k,i,n])=>`<button class="${tab==k||(tab=='game'&&k=='home')?'on':''}" onclick="tab='${k}';go()"><b>${i}</b>${n}</button>`).join('');
const b=$('#sb');if(b)b.textContent=AU.mute?'🔇':'🔊';if(inGame()&&!AU.mute)mstart();else{mstop();micStop()}scrollTo(0,0)}
setInterval(()=>{const a=activeGame();if(!a)return;const g=a.g;if(!g||g.done||!g.c||g.tm!=1)return;const n=Math.max(0,Math.ceil((g.end-Date.now())/1000)),e=$('#tm');if(e){e.textContent=fmt(n);const tb=$('#tb');if(tb)tb.style.width=(a.sec?100*n/a.sec:0)+'%'}if(n>0&&n<=5&&g.ln!==n){g.ln=n;sfx('tick')}if(!n){g.tm=2;sfx('tend');a.sv();toast('Время вышло — выберите результат');go()}},250);
function exportSave(){const keys=['mp2','mp2_wait','mp2_team','mp2_secret','mp2_mem','mp2snd','mp2_ads'],o={};keys.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)o[k]=v});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='mamchkin-save.json';a.click()}
function importSave(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.keys(o).forEach(k=>localStorage.setItem(k,o[k]));location.reload()}catch(e){toast('Не удалось прочитать файл')}};r.readAsText(f)}
document.addEventListener('keydown',e=>{if(e.key=='Escape')M()});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx('click')});
addEventListener('pagehide',()=>{mstop();micStop();save();wsave();tsave();qsave();msave()});
document.addEventListener('visibilitychange',()=>{if(AU.ctx){try{document.hidden?AU.ctx.suspend():AU.ctx.resume()}catch(e){}}});
ADS.init();burnPasses();go();
if(!S.ob)M(`<h2>Добро пожаловать</h2><p>Успех приносит очко и награду, неудача — карту заботы. Базовая колода бесплатна, остальные открываются за рекламу. Комфорт малыша всегда важнее игры.</p><button class="b" onclick="S.ob=1;save();M()">Начать</button>`);
else if(S.g&&S.g.on&&S.g.c)M(`<h2>🦁 Босс вернулся!</h2><p>Мы сохранили твою игру. Продолжаем?</p><button class="b" onclick="M();tab='game';go()">Продолжить игру</button><button class="b s" onclick="M()">На главную</button>`);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>

/* Home launcher + tabletop refresh */
body{background:radial-gradient(ellipse at 50% -8%,#263451 0,#111a2e 38%,#0c1425 72%) fixed;color:#f4ead8}
#app{padding:0 12px 104px;max-width:600px}
header{position:relative;gap:7px;padding:13px 0 11px;border-bottom:1px solid #bd965c66;background:linear-gradient(180deg,#111b30,#111a2c);color:#f1dfbd}
header h1{font-size:clamp(22px,5.8vw,29px);line-height:1.02;text-align:center;color:#e4c17f;flex:1;text-shadow:0 2px 12px #0008}
header .em{width:34px;height:34px;filter:drop-shadow(0 2px 5px #0008)}
.gear{color:#e3c58d;font-size:20px;padding:4px}
#v>h2{color:#e9cc94;font-size:27px;margin:18px 4px 4px}
#v>.mu{color:#c2c5cf;margin:0 4px 12px}
.home-shell{position:relative;margin:0 -12px;padding:14px 12px 24px;overflow:hidden;background:
 radial-gradient(ellipse at 50% 0%,#34435c 0,#17243a 44%,#10192b 80%);
 border-bottom:1px solid #b98a4b;box-shadow:inset 0 1px #e6c98a22}
.home-shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:linear-gradient(135deg,transparent 48%,#c99a5540 49%,transparent 50%),linear-gradient(45deg,transparent 48%,#c99a5526 49%,transparent 50%);background-size:38px 38px}
.home-brand{position:relative;text-align:center;padding:3px 0 12px;color:#e8c987}
.home-brand .brand-kicker{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#c5a46d}
.home-brand .brand-rule{display:flex;align-items:center;justify-content:center;gap:10px;font:700 12px 'Cormorant Garamond',Georgia,serif;letter-spacing:2px;color:#d8b77d}
.home-brand .brand-rule:before,.home-brand .brand-rule:after{content:"";height:1px;width:24%;background:linear-gradient(90deg,transparent,#c99a55)}
.home-brand .brand-rule:after{transform:scaleX(-1)}
.tabletop{position:relative;padding:15px 14px 14px;border:1px solid #d6b778;border-radius:23px;background:linear-gradient(145deg,#fbf3e2,#e9d8b8 60%,#f7edda);color:#20243a;box-shadow:0 12px 28px #050a14a8,inset 0 0 0 4px #fff7,inset 0 0 0 5px #b98b4e}
.tabletop:before{content:"";position:absolute;inset:7px;border:1px solid #c4a16b;border-radius:17px;pointer-events:none}
.tabletop-head{position:relative;text-align:center;font:700 27px/1.05 'Cormorant Garamond',Georgia,serif;color:#6d4d20;margin:1px 0 12px}
.tabletop-main{position:relative;display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center}
.tabletop-cover{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:11px;border:2px solid #b68a4d;box-shadow:0 6px 14px #1a203344}
.tabletop-data{min-width:0}
.tabletop-status{display:inline-flex;align-items:center;gap:5px;border:1px solid #b28a4e;border-radius:99px;padding:3px 9px;font-size:11px;color:#765421;background:#fff8e9}
.tabletop-score{display:grid;grid-template-columns:1fr 1fr;margin:9px 0 10px}
.tabletop-score>div{text-align:center;padding:0 4px}
.tabletop-score>div+div{border-left:1px solid #c2a77c}
.tabletop-score b{display:block;font:700 34px 'Cormorant Garamond',Georgia,serif;color:#805d29;line-height:1}
.tabletop-score span{font-size:12px;font-weight:700;color:#28283a}
.tabletop-score small{font-size:10px;color:#746b5d}
.tabletop-continue{position:relative;display:block;width:100%;margin:9px 0 0;padding:11px 12px;border:1px solid #e6c47c;border-radius:99px;background:linear-gradient(#d8b06a,#a87530);color:#1e1a13;font-weight:800;font-size:14px;box-shadow:0 3px 0 #785323,inset 0 1px #fff8}
.tabletop-continue:active{transform:translateY(2px);box-shadow:0 1px 0 #785323}
.tabletop-foot{font-size:10px;color:#786b59;text-align:center;margin-top:9px}
.mode-heading{position:relative;display:flex;align-items:center;gap:10px;justify-content:center;margin:20px 0 12px;color:#efd8a9;font:700 25px 'Cormorant Garamond',Georgia,serif;text-align:center}
.mode-heading:before,.mode-heading:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#c39450)}
.mode-heading:after{transform:scaleX(-1)}
.mode-grid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode-card{min-width:0;overflow:hidden;border:1px solid #c89b59;border-radius:15px;padding:8px;background:linear-gradient(160deg,#1e2a43,#10192d);box-shadow:0 7px 17px #050a1499,inset 0 0 0 3px #d0a15b20;color:#f5e5c5;text-align:center}
.mode-card img{display:block;width:100%;height:124px;object-fit:cover;object-position:center 22%;border:1px solid #b98b4d;border-radius:9px;background:#10192d}
.mode-card h3{font:700 18px/1.05 'Cormorant Garamond',Georgia,serif;color:#e7c88d;margin:8px 0 3px;min-height:38px}
.mode-card p{font-size:11px;line-height:1.25;color:#c8c4bd;min-height:28px;margin:0 0 7px}
.mode-card .mode-status{display:inline-block;font-size:10px;border-radius:99px;border:1px solid #b38c53;padding:3px 8px;color:#e3c58d;white-space:nowrap}
.mode-card .mode-status.live{border-color:#7caa7b;color:#c2e1b8;background:#29432e}
.mode-card .mode-status.ready{border-color:#b38c53;color:#edcf99;background:#49351f}
.mode-card button{width:100%;border:1px solid #c69b5c;border-radius:99px;background:linear-gradient(#d7b16d,#9d7139);color:#211b12;font-size:12px;font-weight:800;padding:8px 4px;margin-top:8px}
.mode-card button[disabled]{opacity:.65;background:#5a4937;color:#e3d2b7}
.home-note{position:relative;margin:14px 0 0;padding:10px 12px;border:1px solid #c09351;border-radius:12px;background:#f5ead6;color:#64543b;font-size:11px;text-align:center}
.home-extra{position:relative;margin-top:10px}
.home-extra .p{background:#f4ead7;border-color:#c6a36f;color:#292b3b}
nav{background:#f5ead7f5;border-top:1px solid #b98a4b;box-shadow:0 -5px 18px #050a1426;backdrop-filter:blur(10px)}
nav button{color:#777789;font-size:11px;padding:8px 0 9px}
nav button b{font-size:21px}
nav .on{color:#79551f;font-weight:800}
.p{background:linear-gradient(145deg,#f8f2e6,#efe5d2);color:#1b2238}
@media(min-width:480px){.tabletop-main{grid-template-columns:112px 1fr}.tabletop-cover{max-height:150px;object-fit:contain}.mode-card img{height:150px}.mode-card h3{font-size:20px}}
@media(max-width:360px){.tabletop-main{grid-template-columns:72px 1fr;gap:8px}.tabletop-head{font-size:24px}.tabletop-score b{font-size:29px}.mode-grid{gap:7px}.mode-card{padding:6px}.mode-card img{height:105px}.mode-card h3{font-size:16px}}

/* Keep full deck artwork visible on the home screen */
.mode-card img{
  object-fit:contain;
  object-position:center;
  padding:4px;
  background:#10192d;
}
.tabletop-cover{
  object-fit:contain;
  object-position:center;
  padding:4px;
  background:#10192d;
}

/* Memory archive: themed sections, three physical card piles and card flow */
.mem-archive-head{margin:12px 0 18px;padding:14px;border:1px solid #b98a4b;border-radius:14px;background:linear-gradient(145deg,#1b2940,#101a2c);box-shadow:inset 0 0 0 2px #d7b77818,0 8px 20px #050a1470;text-align:center;color:#f1dfbd}
.mem-kicker{font-size:10px;letter-spacing:3px;color:#d5b77d}
.mem-archive-head h2{margin:5px 0 9px!important;color:#e9cc94!important}
.mem-progress-line{display:flex;justify-content:center;align-items:baseline;gap:8px;color:#d9c49f}.mem-progress-line b{font:700 23px Georgia,serif;color:#e8c47e}.mem-progress-line span,.mem-summary{font-size:11px;color:#c2c5cf}
.mem-progress-track{height:6px;margin:9px 4px;background:#050b16;border:1px solid #a88751;border-radius:9px;overflow:hidden}.mem-progress-track i{display:block;height:100%;background:linear-gradient(90deg,#9b7138,#e6c27b);border-radius:9px}
.mem-summary{margin:7px 0 11px}
.mem-section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:12px 0}

.mem-section-card:before{content:"";position:absolute;inset:8px;border:1px solid #c49a5c88;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0 13px,#c49a5c0b 14px 15px,transparent 16px 27px)}
.mem-section-num,.mem-section-count,.mem-section-plaque{position:relative;z-index:1}.mem-section-num{font:10px Georgia,serif;letter-spacing:2px;color:#d6b77b}
.mem-section-plaque{display:flex;align-items:center;justify-content:center;width:100%;min-height:65px;padding:9px 7px;border:3px double #caa365;background:linear-gradient(145deg,#17243a,#0d1729);box-shadow:inset 0 0 0 1px #e8d09a24,0 3px 8px #0008;font:600 17px/1.12 Georgia,serif;text-align:center;color:#f1dfbd}
.mem-section-count{font-size:10px;color:#c5a875;letter-spacing:1px}
.mem-note{color:#c2c5cf;text-align:center;font-size:12px}
.mem-section-heading{text-align:center;color:#e9cc94;margin:16px 0}
.mem-pile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}

.mem-pile-card strong{font-size:12px;text-align:center}.mem-pile-card small{font-size:10px;color:#c6ad7e}
.mem-stack{position:relative;display:block;width:67px;height:91px;margin:4px 0 3px}

.mem-card-back:before{content:"";position:absolute;inset:8px;border:1px solid #c49a5c88;pointer-events:none;background:repeating-linear-gradient(45deg,transparent 0 12px,#c49a5c0b 13px 14px,transparent 15px 25px)}
.mem-card-number,.mem-card-plaque,.mem-card-foot{position:relative;z-index:1}.mem-card-number,.mem-card-foot{font-size:9px;letter-spacing:1px;color:#d6b77b}

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
/* VK Bridge: запуск, пользовательское облачное сохранение и рекламные методы. */
(function(){
  const bridge = window.vkBridge;
  const KEYS = ['mp2','mp2_wait','mp2_mem','mp2_team','mp2_secret','mp2snd'];
  const META_KEY = 'mp2sync_meta';
  const CHUNK_BYTES = 2700;
  const state = {
    available: !!(bridge && typeof bridge.send === 'function'),
    initialized: false,
    syncing: false,
    syncStatus: 'Локальное сохранение',
    syncError: null,
    error: null,
    lastSyncAt: null,
    remoteMeta: null
  };
  const send = async (method, params) => {
    if (!state.available) throw new Error('VK Bridge недоступен. Открой приложение внутри VK.');
    return bridge.send(method, params || {});
  };
  const readMany = async keys => {
    const values = {};
    for (let i=0;i<keys.length;i+=10) {
      const response = await send('VKWebAppStorageGet', { keys: keys.slice(i,i+10) });
      (response.keys || []).forEach(item => { values[item.key] = item.value || ''; });
    }
    return values;
  };
  const encodeChunks = value => {
    const bytes = new TextEncoder().encode(value);
    const chunks = [];
    for (let i=0;i<bytes.length;i+=CHUNK_BYTES) {
      const part = bytes.subarray(i, i+CHUNK_BYTES);
      let binary = '';
      for (let j=0;j<part.length;j++) binary += String.fromCharCode(part[j]);
      chunks.push(btoa(binary));
    }
    return chunks.length ? chunks : [''];
  };
  const decodeChunks = chunks => {
    const bytes = [];
    chunks.forEach(chunk => {
      const binary = atob(chunk);
      for (let i=0;i<binary.length;i++) bytes.push(binary.charCodeAt(i));
    });
    return new TextDecoder().decode(new Uint8Array(bytes));
  };
  const chunkKey = (key, rev, index) => 'mp2sync_' + key + '_' + rev + '_' + index;
  const loadRemote = async () => {
    const metaValue = (await readMany([META_KEY]))[META_KEY];
    if (!metaValue) return null;
    const meta = JSON.parse(metaValue);
    if (!meta || meta.v !== 1 || !meta.keys) return null;
    const requests = [];
    Object.entries(meta.keys).forEach(([key, info]) => {
      for (let i=0;i<info.count;i++) requests.push([key,info.rev,i,chunkKey(key,info.rev,i)]);
    });
    const raw = await readMany(requests.map(x=>x[3]));
    const values = {};
    Object.entries(meta.keys).forEach(([key, info]) => {
      const chunks = [];
      for (let i=0;i<info.count;i++) {
        const value = raw[chunkKey(key,info.rev,i)];
        if (typeof value !== 'string' || !value) return;
        chunks.push(value);
      }
      try { values[key] = decodeChunks(chunks); } catch (error) { /* повреждённый блок не заменяет локальные данные */ }
    });
    return { meta, values };
  };
  const writeRemote = async (values, baseMeta, revision) => {
    const next = {
      v: 1,
      rev: revision,
      keys: Object.assign({}, baseMeta && baseMeta.keys || {})
    };
    const old = [];
    for (const [key,value] of Object.entries(values)) {
      const chunks = encodeChunks(value);
      const previous = next.keys[key];
      for (let i=0;i<chunks.length;i++) {
        await send('VKWebAppStorageSet', { key: chunkKey(key,revision,i), value: chunks[i] });
      }
      next.keys[key] = { rev: revision, count: chunks.length };
      if (previous) for (let i=0;i<previous.count;i++) old.push(chunkKey(key,previous.rev,i));
    }
    await send('VKWebAppStorageSet', { key: META_KEY, value: JSON.stringify(next) });
    for (const key of old) {
      try { await send('VKWebAppStorageSet', { key, value: '' }); } catch (error) { /* старые блоки не используются */ }
    }
    state.remoteMeta = next;
    state.lastSyncAt = Date.now();
    state.syncError = null;
  };
  const localRevision = () => Number(localStorage.getItem('mp2_sync_rev') || 0) || 0;
  const boot = async () => {
    if (!state.available) return false;
    state.syncing = true;
    state.syncStatus = 'Подключение к VK…';
    try {
      await send('VKWebAppInit');
      state.initialized = true;
      state.error = null;
      state.syncStatus = 'Проверка сохранений…';
      const remote = await loadRemote();
      state.remoteMeta = remote && remote.meta || null;
      const localRev = localRevision();
      const remoteRev = remote && Number(remote.meta.rev) || 0;
      if (remote && remoteRev > localRev) {
        Object.entries(remote.values).forEach(([key,value]) => {
          if (KEYS.includes(key)) localStorage.setItem(key,value);
        });
        localStorage.setItem('mp2_sync_rev',String(remoteRev));
      } else if (!remote || localRev > remoteRev) {
        const local = {};
        KEYS.forEach(key => {
          const value = localStorage.getItem(key);
          if (value !== null) local[key] = value;
        });
        if (Object.keys(local).length) {
          const rev = Math.max(localRev,remoteRev)+1;
          localStorage.setItem('mp2_sync_rev',String(rev));
          await writeRemote(local,remote && remote.meta,rev);
        }
      }
      state.syncStatus = 'Сохранения синхронизированы с VK';
      return true;
    } catch (error) {
      state.error = String(error && error.message || error);
      state.syncError = state.error;
      state.syncStatus = 'VK недоступен — используем локальные сохранения';
      return false;
    } finally {
      state.syncing = false;
    }
  };
  let pending = new Set(), syncTimer = null, flushPromise = null;
  const flush = async () => {
    if (!state.initialized || !pending.size) return flushPromise || false;
    if (flushPromise) return flushPromise;
    const keys = Array.from(pending);
    pending.clear();
    const values = {};
    keys.forEach(key => {
      const value = localStorage.getItem(key);
      if (value !== null) values[key] = value;
    });
    if (!Object.keys(values).length) return false;
    const revision = Math.max(localRevision(),Number(state.remoteMeta && state.remoteMeta.rev)||0)+1;
    localStorage.setItem('mp2_sync_rev',String(revision));
    state.syncing = true;
    state.syncStatus = 'Синхронизация с VK…';
    flushPromise = writeRemote(values,state.remoteMeta,revision).then(() => {
      state.syncStatus = 'Сохранения синхронизированы с VK';
      return true;
    }).catch(error => {
      state.syncError = String(error && error.message || error);
      state.syncStatus = 'Не удалось синхронизировать — данные остались на устройстве';
      keys.forEach(key => pending.add(key));
      return false;
    }).finally(() => {
      state.syncing = false;
      flushPromise = null;
      if (pending.size) scheduleFlush();
    });
    return flushPromise;
  };
  function scheduleFlush() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(flush,800);
  }
  const installPersistence = () => {
    if (!state.initialized || window.__MP_VK_STORAGE_PATCHED) return;
    const originalSetItem = Storage.prototype.setItem;
    Storage.prototype.setItem = function(key,value) {
      originalSetItem.call(this,key,value);
      if (this === window.localStorage && KEYS.includes(String(key))) {
        pending.add(String(key));
        scheduleFlush();
      }
    };
    window.__MP_VK_STORAGE_PATCHED = true;
    window.addEventListener('pagehide',() => { if(pending.size) flush(); });
  };
  const api = {
    state,
    isAvailable: () => state.available,
    init: boot,
    boot,
    installPersistence,
    flush,
    getUserInfo: () => send('VKWebAppGetUserInfo'),
    checkRewarded: async () => {
      const result = await send('VKWebAppCheckNativeAds', { ad_format: 'reward' });
      return !!result.result;
    },
    showRewarded: async () => {
      const result = await send('VKWebAppShowNativeAds', { ad_format: 'reward' });
      return !!result.result;
    },
    showInterstitial: async () => {
      const result = await send('VKWebAppShowNativeAds', { ad_format: 'interstitial' });
      return !!result.result;
    },
    storageGet: async keys => send('VKWebAppStorageGet', { keys: Array.isArray(keys) ? keys : [keys] }),
    storageSet: async (key,value) => send('VKWebAppStorageSet', { key, value: String(value) })
  };
  window.MP_VK = api;
})();
</script>

return h+'<button class="b" onclick="M()">Закрыть</button>'}
